name: Build
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact release commit to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-numpy pipewire-bin libpipewire-0.3-dev libsndfile1-dev libsamplerate0-dev librubberband-dev libtag1-dev qt6-base-dev qt6-declarative-dev libqt6svg6-dev qt6-wayland qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-controls qml6-module-qtquick-dialogs qml6-module-qt-labs-folderlistmodel qml6-module-qtquick-layouts qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtqml-workerscript qml6-module-qtquick-templates
      - name: Configure
        run: cmake -S . -B build/dev -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DPython3_EXECUTABLE=/usr/bin/python3
      - name: Build
        run: cmake --build build/dev --parallel 2
      - name: Test core
        run: ctest --test-dir build/dev --output-on-failure
      - name: Test QML with software rendering
        run: QT_QPA_PLATFORM=offscreen QT_QUICK_CONTROLS_STYLE=Basic QT_QUICK_BACKEND=software build/dev/conflux --smoke-test
      - name: Test preparation during virtual playback
        run: python3 tools/experiments/private_routing_check.py build/dev/conflux-preparation-controller-check build/preparation-check --functional-only
      - name: Test live failure with prepared peer and recording
        run: python3 tools/experiments/private_routing_check.py build/dev/conflux-preparation-controller-check build/live-failure-check --live-failure-only

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Install coverage build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-numpy python3-venv pipewire-bin libpipewire-0.3-dev libsndfile1-dev libsamplerate0-dev librubberband-dev libtag1-dev qt6-base-dev qt6-declarative-dev libqt6svg6-dev qt6-wayland qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-controls qml6-module-qtquick-dialogs qml6-module-qt-labs-folderlistmodel qml6-module-qtquick-layouts qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtqml-workerscript qml6-module-qtquick-templates
      - name: Install isolated coverage tools
        run: |
          python3 -m venv --system-site-packages build/coverage-venv
          build/coverage-venv/bin/python -m pip install -r tools/coverage/requirements.txt
      - name: Measure existing tests
        run: build/coverage-venv/bin/python tools/coverage/run.py --private-routing
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-reports
          path: build/coverage/reports
          if-no-files-found: warn

  release-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: git-cliff@2.14.2
          fallback: none
      - name: Install pinned actionlint
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: Validate workflows
        run: '"$RUNNER_TEMP/actionlint"'
      - name: Test release preparation and publication failures
        run: python3 tests/release_test.py
      - name: Validate release PR metadata
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.action != 'closed'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py check-pr
