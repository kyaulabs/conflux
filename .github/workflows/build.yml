name: Build
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-numpy pipewire-bin libpipewire-0.3-dev libsndfile1-dev libsamplerate0-dev qt6-base-dev qt6-declarative-dev libqt6svg6-dev qt6-wayland qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtqml-workerscript qml6-module-qtquick-templates
      - name: Configure
        run: cmake -S . -B build/dev -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DPython3_EXECUTABLE=/usr/bin/python3
      - name: Build
        run: cmake --build build/dev --parallel 2
      - name: Test core
        run: ctest --test-dir build/dev --output-on-failure
      - name: Test QML with software rendering
        run: QT_QPA_PLATFORM=offscreen QT_QUICK_CONTROLS_STYLE=Basic QT_QUICK_BACKEND=software build/dev/conflux --smoke-test
      - name: Test preparation during virtual playback
        run: python3 tools/experiments/private_routing_check.py build/dev/conflux-preparation-controller-check build/preparation-check --functional-only

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install coverage build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-numpy python3-venv pipewire-bin libpipewire-0.3-dev libsndfile1-dev libsamplerate0-dev qt6-base-dev qt6-declarative-dev libqt6svg6-dev qt6-wayland qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtqml-workerscript qml6-module-qtquick-templates
      - name: Install isolated coverage tools
        run: |
          python3 -m venv --system-site-packages build/coverage-venv
          build/coverage-venv/bin/python -m pip install -r tools/coverage/requirements.txt
      - name: Measure existing tests
        run: build/coverage-venv/bin/python tools/coverage/run.py --private-routing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: build/coverage/reports
          if-no-files-found: warn
