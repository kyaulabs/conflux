# Shared by CHANGELOG.md and the branded GitHub release notes.
[changelog]
header = """
# Changelog

Changes follow [Conventional Commits](https://www.conventionalcommits.org/en/v1.0.0/)
and [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version %}\
## [{{ version }}](https://github.com/kyaulabs/conflux/releases/tag/{{ version }})
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/kyaulabs/conflux/commit/{{ commit.id }})){% if commit.breaking %} **BREAKING:** {{ commit.breaking_description | default(value="Incompatible change; review before updating.") }}{% endif %}
{% endfor %}\
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+$'
topo_order = false
sort_commits = "oldest"
commit_parsers = [
  { message = "^docs", group = "Documentation", skip = true },
  { message = '^chore|^ci|^test|^style|^refactor', group = "Maintenance", skip = true },
  { body = "(?i)security", group = "Security" },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^revert", group = "Reverts" },
  { message = ".*", group = "Maintenance" },
]

[bump]
initial_tag = "v0.1.0"
features_always_bump_minor = true
breaking_always_bump_major = true
